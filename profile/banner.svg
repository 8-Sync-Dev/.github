<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="8 Sync — AI developer education and developer tools, made in Vietnam. We teach you to learn, not to copy.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070c"/>
      <stop offset="1" stop-color="#0e0b1a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#4F7CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#A855F7" stop-opacity="0.42"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .drift1 { animation: d1 15s ease-in-out infinite alternate; }
      .drift2 { animation: d2 19s ease-in-out infinite alternate; }
      .drift3 { animation: d3 17s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(160px, 50px); } }
      @keyframes d2 { to { transform: translate(-180px, -40px); } }
      @keyframes d3 { to { transform: translate(-80px, 40px); } }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .r1 { animation-delay: .1s } .r2 { animation-delay: .35s } .r3 { animation-delay: .6s } .r4 { animation-delay: .85s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .chip rect { fill: #ffffff; fill-opacity: 0.045; stroke: #ffffff; stroke-opacity: 0.12; }
      .chip text { fill: #c3cae8; font-size: 15px; font-weight: 600; }
      .chip.c1 rect { animation: hl 8s linear infinite 0s; }
      .chip.c2 rect { animation: hl 8s linear infinite 1s; }
      .chip.c3 rect { animation: hl 8s linear infinite 2s; }
      .chip.c4 rect { animation: hl 8s linear infinite 3s; }
      .chip.c5 rect { animation: hl 8s linear infinite 4s; }
      .chip.c6 rect { animation: hl 8s linear infinite 5s; }
      .chip.c7 rect { animation: hl 8s linear infinite 6s; }
      .chip.c8 rect { animation: hl 8s linear infinite 7s; }
      @keyframes hl { 0%, 11% { stroke: #22D3EE; stroke-opacity: 1; fill: #22D3EE; fill-opacity: .14; } 14%, 100% { stroke: #ffffff; stroke-opacity: .12; fill: #ffffff; fill-opacity: .045; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <circle class="drift1" cx="200" cy="60" r="280" fill="url(#orbA)"/>
  <circle class="drift2" cx="1040" cy="320" r="300" fill="url(#orbB)"/>
  <circle class="drift3" cx="760" cy="40" r="200" fill="url(#orbC)"/>
  <rect class="scan" x="0" y="0" width="120" height="380" fill="url(#brand)" opacity="0.05"/>

  <g class="rise r1"><text x="600" y="70" text-anchor="middle" class="mono" fill="#22D3EE" font-size="15" letter-spacing="3">AI DEVELOPER EDUCATION · AI DEVELOPER TOOLS</text></g>
  <g class="rise r2" filter="url(#glow)"><text x="600" y="168" text-anchor="middle" fill="url(#brand)" font-size="104" font-weight="900" letter-spacing="-2">8 Sync</text></g>
  <g class="rise r3">
    <text x="600" y="214" text-anchor="middle" fill="#e8ebff" font-size="22" font-weight="600">We teach you to learn, not to copy.</text>
    <text x="600" y="244" text-anchor="middle" fill="#8e97bd" font-size="16">Made in Ho Chi Minh City, Vietnam · NVIDIA Inception member · since 2024</text>
  </g>

  <g class="rise r4">
    <g class="chip c1" transform="translate(84 286)"><rect width="104" height="40" rx="20"/><text x="52" y="26" text-anchor="middle">ZUS</text></g>
    <g class="chip c2" transform="translate(200 286)"><rect width="104" height="40" rx="20"/><text x="52" y="26" text-anchor="middle">Coding</text></g>
    <g class="chip c3" transform="translate(316 286)"><rect width="110" height="40" rx="20"/><text x="55" y="26" text-anchor="middle">Courses</text></g>
    <g class="chip c4" transform="translate(438 286)"><rect width="96" height="40" rx="20"/><text x="48" y="26" text-anchor="middle">News</text></g>
    <g class="chip c5" transform="translate(546 286)"><rect width="122" height="40" rx="20"/><text x="61" y="26" text-anchor="middle">AcoLeads</text></g>
    <g class="chip c6" transform="translate(680 286)"><rect width="104" height="40" rx="20"/><text x="52" y="26" text-anchor="middle">mind0</text></g>
    <g class="chip c7" transform="translate(796 286)"><rect width="88" height="40" rx="20"/><text x="44" y="26" text-anchor="middle">TIA</text></g>
    <g class="chip c8" transform="translate(896 286)"><rect width="220" height="40" rx="20"/><text x="110" y="26" text-anchor="middle" class="mono">$ 8sync autopilot</text></g>
  </g>
</svg>
